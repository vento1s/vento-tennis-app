<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#002A52"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>송사모 테니스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&family=Roboto:ital,wght@0,500;0,700;0,900;1,700;1,900&display=swap">
<style>
/* Layout: SSM championship look — navy scoreboard header with a blue rule, dark rounded cards, italic sport labels. Deliberately dark-only. */
:root{
  --bg:#1E2123; --card:#131415; --card-2:#191B1D; --field:#24282B; --field-2:#2C3135; --line:#363B40;
  --ink:#F3F7FB; --ink-2:#D6EAFB; --muted:#8C959D; --dim:#5D656C;
  --navy:#002A52; --navy-2:#003A70; --blue:#0A8FD8; --on-blue:#FFFFFF; --gold:#FFD400; --on-gold:#1C1A00; --bronze:#D08A3C; --bronze-bg:#3A2A1C;
  --win:#3FCB8C; --loss:#FF7E6E; --focus:#5EC2FF;
  --f-title:"Black Han Sans","Noto Sans KR",sans-serif;
  --f-sport:"Roboto","Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-body:"Noto Sans KR","Roboto",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r-card:28px; --r-field:20px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.it{font-style:italic}
.sport{font-family:var(--f-sport);font-style:italic;font-weight:900}
.tab-n{font-variant-numeric:tabular-nums}

/* phone frame on wide screens */
html{scroll-padding-block:110px 120px}
#app{container-type:inline-size;container-name:app;min-height:100%;background:var(--bg)}
#sc{scroll-padding-block:110px 120px}
@media (min-width:700px) and (min-height:620px){
  html,body{height:100%;overflow:hidden}
  body{background:#0A0C0D;display:flex;align-items:center;justify-content:center}
  body::before{display:none}
  #app{width:390px;height:min(844px,calc(100vh - 48px));min-height:0;overflow:hidden;border-radius:46px;border:10px solid #2A2E32;box-shadow:0 0 0 2px #3A3F44,0 30px 80px rgba(0,0,0,.6);transform:translateZ(0);flex:none}
  #sc{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
  #sc::-webkit-scrollbar{display:none}
  .top{top:0}
}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);border-bottom:5px solid var(--blue)}
.top-in{max-width:640px;margin:0 auto;padding-block:18px 16px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.back{width:32px;height:40px;display:grid;place-items:center;color:var(--ink);flex:none;margin-left:-6px}
.back svg{width:22px;height:22px}
.logo{flex:1;min-width:0;display:grid;gap:4px;overflow:hidden}
.logo-r{display:flex;align-items:center;gap:8px}
.ssm{background:var(--blue);color:var(--on-blue);font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:13px;padding:3px 8px;border-radius:7px;letter-spacing:.02em}
.ttl{font-family:var(--f-title);font-style:italic;font-size:clamp(18px,5.6vw,25px);line-height:1;white-space:nowrap;color:var(--ink)}
.sub{display:flex;align-items:center;gap:6px;font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:10.5px;letter-spacing:.16em;color:var(--blue);white-space:nowrap}
.ver{background:var(--blue);color:var(--on-blue);letter-spacing:.06em;font-size:9.5px;padding:1px 5px;border-radius:4px}
.crown{color:var(--gold);width:46px;height:46px;display:grid;place-items:center;flex:none}
.crown svg{width:36px;height:36px}
.minfo{text-align:right;flex:none;max-width:42%;display:grid;gap:1px}
.minfo .a{color:var(--blue);font-weight:900;font-style:italic;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minfo .b{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minfo .c{color:var(--muted);font-size:11px;font-family:var(--f-sport);font-weight:700}

main{max-width:640px;margin:0 auto;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}

/* type */
.h1{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:21px;letter-spacing:.03em;color:var(--ink-2);margin:0;text-transform:uppercase}
.lbl{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:11.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.eyebrow{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:12px;letter-spacing:.3em;color:var(--blue);text-transform:uppercase}
.big{font-weight:900;font-style:italic;font-size:27px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}

/* cards */
.card{background:var(--card);border-radius:22px;padding:16px 16px;display:grid;gap:12px;min-width:0;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card.tight{gap:10px}
.step{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:12px;background:var(--field);padding:5px 10px;border-radius:8px;color:var(--ink-2)}
.field{display:grid;gap:10px;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.inp{display:flex;align-items:center;gap:10px;background:var(--field);border-radius:16px;padding:0 14px;height:50px;min-width:0}
.inp svg{width:20px;height:20px;flex:none;color:var(--ink-2)}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;font-weight:900;font-style:italic;font-size:16px;color:var(--ink)}
.inp:focus-within{outline:2px solid var(--blue)}
.inp input::placeholder{color:var(--dim)}
.inp{position:relative}
.inp input[type=date]{min-width:0;width:100%}
.inp input[type=date]::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;opacity:0;cursor:pointer}
.inp input[type=date]::-webkit-date-and-time-value{text-align:left}
@container app (max-width:520px){.g2.stack{grid-template-columns:1fr}}

/* generator modes */
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:42px 1fr 22px;gap:12px;align-items:center;text-align:left;background:var(--card-2);border:2px solid var(--line);border-radius:20px;padding:13px 14px;width:100%}
.mode .ic{width:42px;height:42px;border-radius:13px;background:var(--field);display:grid;place-items:center;color:var(--ink-2)}
.mode .ic svg{width:22px;height:22px}
.mode .tx{min-width:0;display:grid;gap:2px}
.mode b{font-weight:900;font-style:italic;font-size:16px}
.mode small{font-size:12.5px;color:var(--muted);line-height:1.35}
.mode .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box}
.mode[aria-pressed="true"]{border-color:var(--blue);background:rgba(10,143,216,.1)}
.mode[aria-pressed="true"] .ic{background:var(--blue);color:var(--on-blue)}
.mode[aria-pressed="true"] .rd{border:7px solid var(--blue)}
.mode.lg{grid-template-columns:36px 1fr 16px;gap:10px;padding:10px 12px;border-radius:16px;background:var(--card);border-color:transparent}
.mode.lg .ic{width:36px;height:36px;border-radius:11px;background:var(--navy);color:var(--ink)}
.mode.lg .ic svg{width:19px;height:19px}
.mode.lg b{font-size:15px}
.mode.lg small{font-size:11.5px;line-height:1.3}
.mode.lg .chev{color:var(--muted);display:grid;place-items:center}
.mode.lg .chev svg{width:15px;height:15px}
.mode.lg:not(:disabled):active{border-color:var(--blue)}
.modes:has(.mode.lg){gap:8px}
.bhead .big{font-size:19px;line-height:1.25}
.bhead{gap:4px}
.mode:disabled{opacity:.4;cursor:default}
.bhead{display:grid;gap:8px;padding:4px 4px 2px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--field);color:var(--ink-2);font-weight:900;font-style:italic;font-size:14px;padding:6px 12px;border-radius:999px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.crumbs span{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:11px;letter-spacing:.08em;padding:5px 10px;border-radius:999px;background:var(--card);color:var(--dim)}
.crumbs span.on{background:rgba(10,143,216,.16);color:var(--blue)}
.link-back{color:var(--muted);font-weight:900;font-style:italic;font-size:14px;padding:8px 12px}
.pv{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.vsl2{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:14px;color:var(--blue);background:rgba(10,143,216,.12);padding:6px 10px;border-radius:10px}
.go.blue{background:var(--blue);color:var(--on-blue)}
.go:disabled{opacity:.5;cursor:default}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-ghost svg{width:18px;height:18px}
.seeds{display:grid;gap:6px}
.seed{display:grid;grid-template-columns:30px 1fr auto auto;gap:8px;align-items:center;background:var(--field);border-radius:14px;padding:5px 5px 5px 12px;min-width:0}
.seed .no{font-family:var(--f-sport);font-style:italic;font-weight:900;color:var(--blue);font-size:16px}
.seed .nm{font-weight:900;font-style:italic;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seed .rec{font-family:var(--f-sport);font-style:italic;font-weight:700;font-size:12px;color:var(--muted);white-space:nowrap}
.grip{width:46px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.grip svg{width:20px;height:20px}
.grip:active{color:var(--blue)}
.seed.lifting{z-index:3;background:var(--field-2);box-shadow:0 0 0 2px var(--blue),0 16px 32px rgba(0,0,0,.55);transition:none}
.seed.lifting .grip{color:var(--blue);cursor:grabbing}
.seed.lifting .nm{color:var(--ink)}
.seeds.dragging{-webkit-user-select:none;user-select:none}
.seed .mv{display:flex;gap:4px}
.seed{position:relative}
.seed.moved{z-index:2;animation:seedHi .9s ease-out}
.seed.moved .no,.seed.shifted .no{animation:seedNo .45s ease-out}
.seed.moved .nm{color:var(--ink)}
@keyframes seedHi{0%{background:rgba(10,143,216,.45);box-shadow:0 0 0 2px var(--blue),0 10px 24px rgba(0,0,0,.45)}60%{background:rgba(10,143,216,.22);box-shadow:0 0 0 2px rgba(10,143,216,.5)}100%{background:var(--field);box-shadow:none}}
@keyframes seedNo{0%{transform:scale(1.5);color:var(--gold)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.seed.moved,.seed.moved .no,.seed.shifted .no{animation:none}}
.seed .mv button{width:36px;height:36px;border-radius:10px;background:var(--card-2);color:var(--ink-2);display:grid;place-items:center}
.seed .mv button:disabled{opacity:.3;cursor:default}
.seed .mv svg{width:16px;height:16px}

.venues{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.venue{height:50px;border:2px solid var(--line);border-radius:var(--r-field);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-style:italic;color:var(--muted);padding:0 10px;min-width:0}
.venue span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.venue svg{width:19px;height:19px;flex:none}
.venue[aria-pressed="true"]{background:var(--navy);border-color:var(--navy-2);color:var(--ink);box-shadow:0 6px 18px rgba(0,42,82,.5)}
.venue.add{border-style:dashed}

.seg{display:flex;background:var(--field);border-radius:var(--r-field);padding:6px;gap:4px}
.seg button{flex:1 1 0;min-width:0;border-radius:15px;padding:10px 2px;font-weight:900;font-style:italic;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}

.chips-h{display:flex;gap:6px}
.mini{font-family:var(--f-sport);font-weight:900;font-style:italic;font-size:12px;padding:5px 11px;border-radius:999px;background:var(--field);color:var(--ink-2)}
.mini.blue{color:var(--blue);background:rgba(10,143,216,.14)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:8px}
.pl{aspect-ratio:1;max-width:100%;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:15px;color:var(--ink-2);letter-spacing:-.02em}
.pl.on,.pl[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}

.gobar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(transparent,var(--bg) 30%);padding-block:22px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gobar .go{max-width:608px;margin:0 auto}
.go{width:100%;height:62px;border-radius:999px;background:var(--navy);color:var(--ink);font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.go svg{width:20px;height:20px}
.btn-blue{background:var(--blue);color:var(--on-blue);border-radius:999px;height:48px;padding:0 22px;font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:15px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(10,143,216,.3);white-space:nowrap}
.btn-blue:disabled{opacity:.45;box-shadow:none;cursor:default}
.btn-blue svg{width:18px;height:18px}
.btn-navy{background:var(--navy);color:var(--ink);border-radius:999px;height:56px;width:100%;font-weight:900;font-style:italic;font-size:16px}
.btn-ghost{border:2px solid var(--line);border-radius:999px;height:48px;padding:0 18px;font-weight:900;font-style:italic;color:var(--ink-2)}
.btn-danger{border:2px solid rgba(255,126,110,.4);color:var(--loss);border-radius:999px;height:50px;width:100%;font-weight:900;font-style:italic}

/* feed */
.season{background:var(--card);border-radius:22px;padding:14px 16px;display:grid;gap:10px;position:relative;overflow:hidden}
.season .cnt{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:32px;line-height:1}
.season .cnt span{font-size:20px;color:var(--muted)}
.season select{appearance:none;background:var(--field);border:0;border-radius:999px;padding:6px 14px;font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:13px;color:var(--ink-2)}
.dots{display:grid;gap:6px}
.dots i{height:7px;border-radius:4px;background:var(--field-2)}
.dots i.on{background:var(--blue)} .dots i.up{background:var(--gold)}
.feed{display:grid;gap:8px}
.mcard{background:var(--card);border-radius:18px;padding:11px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;width:100%}
.mdate{display:grid;justify-items:center;min-width:54px;white-space:nowrap}
.mdate b{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:24px;line-height:1}
.mdate span{font-family:var(--f-sport);font-style:italic;font-weight:700;font-size:11px;color:var(--muted);letter-spacing:.1em}
.mtitle{font-weight:900;font-style:italic;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmeta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{min-width:0;display:grid;gap:2px}
.st{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:11px;letter-spacing:.08em;padding:5px 9px;border-radius:8px;white-space:nowrap}
.st.today{background:var(--gold);color:var(--on-gold)}
.st.up{background:rgba(10,143,216,.16);color:var(--blue)}
.st.fin{background:var(--field);color:var(--ink-2)}
.st.none{color:var(--dim);background:var(--card-2)}
.mvp{color:var(--gold)}
.sc.empty{color:var(--dim)}
button.sc{display:grid;place-items:center;cursor:pointer}
.pd{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:10.5px;letter-spacing:.06em}
.pd.up{color:var(--gold)} .pd.dn{color:var(--muted)} .pd.dr{color:var(--ink-2)}
.rk .d b.pt{font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums}
.admtag{background:var(--gold);color:var(--on-gold);letter-spacing:.06em;font-size:9.5px;padding:1px 5px;border-radius:4px}
.copybox{width:100%;min-height:220px;background:var(--field);border:0;border-radius:16px;padding:14px;color:var(--ink);font:14px/1.5 var(--f-body);resize:vertical}
/* pin */
.pinwrap{display:grid;gap:14px}
.dots4{display:flex;justify-content:center;gap:16px;padding:6px 0}
.dots4 i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);transition:background .12s,border-color .12s}
.dots4 i.on{background:var(--blue);border-color:var(--blue)}
.dots4.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.perr{min-height:18px;margin:0;text-align:center;color:var(--loss);font-size:13px;font-weight:700}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:58px;border-radius:18px;background:var(--field);font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:24px;color:var(--ink)}
.keypad button:active{background:var(--blue)}
.keypad .kf{font-size:13px;color:var(--muted);display:grid;place-items:center}
.keypad .kf svg{width:22px;height:22px}
/* score pad */
.spt{display:grid;gap:2px}
.spt b{font-weight:900;font-style:italic;font-size:17px}
.pad{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.pad button{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--field);font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:19px;color:var(--ink-2)}
.pad button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.spvs{display:flex;justify-content:center;align-items:center;gap:12px;font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:26px;line-height:1;color:var(--ink-2)}
.spvs i{color:var(--dim);font-size:24px}
.spvs .w{color:var(--gold)}
/* profile */
.prof{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pbig{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:44px;line-height:1}
.pbig small{font-size:18px;color:var(--blue);margin-left:3px}
.pch{font-size:12.5px;color:var(--muted);font-weight:700}
.pch.pos{color:var(--win)} .pch.neg{color:var(--loss)}
.form{display:grid;gap:4px;justify-items:end}
.form div{display:flex;gap:4px}
.form i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:11px}
.form i.w{background:var(--gold);color:var(--on-gold)} .form i.l{background:var(--field-2);color:var(--muted)} .form i.d{background:var(--navy-2);color:var(--ink-2)}

.bnav-in{align-items:end}

.clist{display:grid;gap:8px}

.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}

.go svg{width:20px;height:20px}

.mc{background:var(--card);border:1px solid rgba(10,143,216,.18);border-radius:18px;padding:10px 12px 12px;display:grid;gap:10px}

.side{display:grid;gap:6px;min-width:0}

.mhero .club-t b{font-size:20px}

.mh-date b{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:16px}
.mh-date span{font-family:var(--f-sport);font-style:italic;font-weight:700;font-size:10px;color:var(--ink-2);letter-spacing:.1em;margin-top:2px}
.mvpb{font-family:var(--f-body)!important;font-size:19px!important;color:var(--gold)!important;padding-top:3px}
.mtabs{background:rgba(0,0,0,.25)}

.club-ic{overflow:hidden}
.club-ic.ph{background:var(--field)}
.club-ic img{width:100%;height:100%;object-fit:cover;display:block}

main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))!important}

/* tabs */

.rlist{display:grid}

.btn-navy{height:50px}
.go{height:56px}

@container app (max-width:430px){.rk{grid-template-columns:40px 1fr auto auto;gap:10px;padding:12px 14px}.rk .n{width:40px;height:40px;font-size:16px}.rk .att{display:none}.rk .nm{font-size:18px}}

/* matches */
.round{display:grid;gap:6px}
.round-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 6px}
.round-h b{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:17px;letter-spacing:.06em;color:var(--ink-2)}
.rest{font-size:12px;color:var(--muted);text-align:right}
.match{background:var(--card);border-radius:18px;padding:10px 12px;display:grid;gap:6px}
.match .mh{display:flex;align-items:center;justify-content:space-between}
.match .x{color:var(--dim);font-size:12px;font-weight:700;padding:4px 6px}
.vs{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:8px}
.team{display:grid;gap:2px;min-width:0}
.team.b{text-align:right}
.team div{font-weight:900;font-style:italic;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.team.w div{color:var(--ink)}
.team .wtag{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:10px;letter-spacing:.14em;color:var(--gold)}
.sc{width:46px;height:46px;text-align:center;background:var(--field);border:2px solid transparent;border-radius:16px;font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums;outline:0;-moz-appearance:textfield}
.sc::-webkit-outer-spin-button,.sc::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sc:focus{border-color:var(--blue)}
.sc.w{border-color:var(--gold)}
.colon{font-family:var(--f-sport);font-weight:900;color:var(--dim)}

/* admin */
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.courts{display:flex;gap:8px;flex-wrap:wrap}
.court{flex:1;min-width:84px;height:46px;border-radius:18px;border:2px solid var(--line);font-family:var(--f-sport);font-style:italic;font-weight:900;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.court svg{width:18px;height:18px}
.court[aria-pressed="true"]{background:#334155;border-color:#7C8797;color:var(--ink)}
.slots{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.slotcol{display:grid;gap:10px;min-width:0}
.slotcol .lbl{text-align:center;color:var(--ink-2)}
.slot{height:48px;border:2px dashed #4A5056;border-radius:18px;background:var(--card-2);font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:14px;color:#AEB6BD;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.slot.on{border-style:solid;border-color:var(--blue);color:var(--ink);background:rgba(10,143,216,.12);font-size:17px}
.vsl{font-family:var(--f-sport);font-style:italic;font-weight:900;color:var(--ink-2);padding-top:30px}
.stepper{display:flex;align-items:center;background:var(--field);border-radius:16px;height:50px;overflow:hidden}
.stepper button{width:52px;height:100%;font-size:22px;color:var(--ink-2)}
.stepper output{flex:1;text-align:center;font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:22px}
.spark{color:var(--gold);width:26px;height:26px;vertical-align:-3px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.infoline{display:grid;gap:4px}
.infoline b{font-weight:900;font-style:italic;font-size:17px}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20}
.modal{position:fixed;z-index:21;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);max-width:520px;margin:0 auto;max-height:84vh;overflow:auto;background:var(--card);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-h{background:var(--navy);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0}
.modal-h h3{margin:0;font-weight:900;font-style:italic;font-size:19px}
.modal-h button{width:36px;height:36px;display:grid;place-items:center}
.modal-h svg{width:24px;height:24px}
.modal-b{padding:16px;display:grid;gap:12px}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pick button{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--field);font-weight:900;font-style:italic;font-size:16px;color:var(--ink-2)}
.pick button:disabled{color:var(--dim);background:var(--card-2);cursor:default}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--field);border-radius:12px;padding:8px 4px;text-align:center;display:grid;gap:2px}
.stat b{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:21px}
.stat span{font-family:var(--f-sport);font-style:italic;font-weight:900;font-size:9.5px;letter-spacing:.12em;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));background:var(--blue);color:var(--on-blue);font-weight:700;padding:11px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.note{font-size:12px;color:var(--dim);text-align:center;margin:0}
@media (prefers-reduced-motion: no-preference){.modal{animation:pop .18s ease-out}@keyframes pop{from{opacity:.4;transform:translateY(-46%)}}}
</style>

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
const SCOPED=['members','meets','matches'];
const RAW={members:[],meets:[],matches:[]};
const clubOf=x=>x.clubId||'default';
function applyClub(){SCOPED.forEach(c=>S[c]=RAW[c].filter(x=>clubOf(x)===S.clubId))}
function snapAll(){return {members:RAW.members,meets:RAW.meets,matches:RAW.matches,config:S.config,clubs:S.clubs}}
function loadAll(d){SCOPED.forEach(c=>RAW[c]=d[c]||[]);S.config=d.config||[];S.clubs=d.clubs||[];applyClub()}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(snapAll()))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d)loadAll(d)}catch(e){}}
const queue=[];
const CACHE=LS+'-cache';
function saveCache(){try{localStorage.setItem(CACHE,JSON.stringify(snapAll()))}catch(e){}}
function loadCache(){try{const d=JSON.parse(localStorage.getItem(CACHE)||'null');if(d&&d.members){loadAll(d);return true}}catch(e){}return false}
function put(col,obj){
  if(SCOPED.includes(col)){
    if(!obj.clubId&&S.clubId!=='default'&&!RAW[col].some(x=>x.id===obj.id))obj={...obj,clubId:S.clubId};
    const r=RAW[col];const j=r.findIndex(x=>x.id===obj.id);if(j>=0)r[j]=obj;else r.push(obj);applyClub();
  }else{const arr=S[col];const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj)}
  render();
  if(!DB){if(S.local)saveLocal();else{queue.push(()=>put(col,obj));saveCache()}return}
  saveCache();
  const {id,...data}=obj;
  chains[id]=(chains[id]||Promise.resolve()).then(()=>DB.collection(col).doc(id).set(data)).catch(e=>toast(e&&e.code==='invalid_argument'?'저장 권한이 없어요. 참여자 권한으로 공유받아 주세요.':'저장하지 못했어요. 다시 시도해 주세요.'));
}
function del(col,id){
  if(SCOPED.includes(col)){RAW[col]=RAW[col].filter(x=>x.id!==id);applyClub()}else S[col]=S[col].filter(x=>x.id!==id);render();
  if(!DB){if(S.local)saveLocal();else queue.push(()=>del(col,id));return}
  saveCache();
  chains[id]=(chains[id]||Promise.resolve()).then(()=>DB.collection(col).doc(id).delete()).catch(()=>toast('삭제하지 못했어요.'));
}

/* ---------- helpers ---------- */
const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const DOWK=['일','월','화','수','목','금','토'];
const pd=d=>{const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd)};
const fmtK=d=>{const x=pd(d);return `${x.getMonth()+1}월 ${x.getDate()}일 (${DOWK[x.getDay()]})`};
const dn=id=>{const m=S.members.find(x=>x.id===id);return m?(m.short||m.nick||m.name):'(삭제됨)'};
const members=()=>S.members.slice().sort((a,b)=>(a.order??99)-(b.order??99)||a.name.localeCompare(b.name,'ko'));
const seasonMeets=()=>S.meets.filter(m=>(m.date||'').slice(0,4)===String(S.season)).sort((a,b)=>a.date.localeCompare(b.date));
const meetMatches=id=>S.matches.filter(x=>x.meetId===id).sort((a,b)=>(a.round-b.round)||(a.court-b.court));
function seasonMatches(){const ids=new Set(seasonMeets().map(m=>m.id));return S.matches.filter(x=>ids.has(x.meetId))}
const done=x=>Number.isFinite(x.sa)&&Number.isFinite(x.sb);
const recW=r=>r.d?`${r.w}W ${r.d}D ${r.l}L`:`${r.w}W ${r.l}L`;
const recK=r=>`${r.w}승 ${r.d?r.d+'무 ':''}${r.l}패`;
const recS=r=>r.d?`${r.w}-${r.d}-${r.l}`:`${r.w}-${r.l}`;
const rate=r=>r.p?r.w/r.p:0;
const pct=r=>r.p?Math.round(rate(r)*100)+'%':'0%';
const typeName=t=>t==='D'?'DOUBLES':'SINGLES';
const curMeet=()=>S.meets.find(x=>x.id===S.meetId);

function tally(matches,ids,type,meets){
  const t={};ids.forEach(id=>t[id]={id,p:0,w:0,d:0,l:0,gf:0,ga:0,att:0});
  (meets||[]).forEach(mt=>(mt.attendees||[]).forEach(id=>{if(t[id])t[id].att++}));
  matches.filter(done).filter(x=>type==='all'||x.type===type).forEach(x=>{
    const res=Math.sign(x.sa-x.sb);
    x.a.forEach(id=>{const r=t[id];if(!r)return;r.p++;res>0?r.w++:res<0?r.l++:r.d++;r.gf+=x.sa;r.ga+=x.sb});
    x.b.forEach(id=>{const r=t[id];if(!r)return;r.p++;res<0?r.w++:res>0?r.l++:r.d++;r.gf+=x.sb;r.ga+=x.sa});
  });
  return Object.values(t).sort((a,b)=>b.w-a.w||rate(b)-rate(a)||(b.gf-b.ga)-(a.gf-a.ga)||b.att-a.att);
}
const seasonStats=type=>tally(seasonMatches(),members().map(m=>m.id),type,seasonMeets());
function seasonRows(type){
  const rows=seasonStats(type);if(type!=='all')return rows;
  return rows.sort((a,b)=>((b.p>0)-(a.p>0))||(pOf(b.id)-pOf(a.id))||rate(b)-rate(a)||b.w-a.w);
}

function mvpOf(meet){const ms=meetMatches(meet.id).filter(done);if(!ms.length)return null;const r=tally(ms,meet.attendees||[],'all')[0];return r&&r.w?r.id:null}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pk=(a,b)=>a<b?a+'|'+b:b+'|'+a;
/* ---------- Elo points (P) ---------- */
const P0=1500;
let ELO={R:{},delta:{},hist:{}};
function computeElo(){
  const R={},hist={};
  S.members.forEach(m=>{R[m.id]=Number.isFinite(m.rating0)?m.rating0:P0;hist[m.id]=[{p:R[m.id]}]});
  const md=Object.fromEntries(S.meets.map(m=>[m.id,m.date||'']));
  const list=S.matches.filter(done).filter(x=>md[x.meetId]).sort((a,b)=>md[a.meetId].localeCompare(md[b.meetId])||(a.round-b.round)||(a.court-b.court)||((a.createdAt||0)-(b.createdAt||0)));
  const delta={};
  list.forEach(x=>{
    const g=id=>R[id]??P0;
    const ra=x.a.reduce((t,id)=>t+g(id),0)/x.a.length,rb=x.b.reduce((t,id)=>t+g(id),0)/x.b.length;
    const ea=1/(1+Math.pow(10,(rb-ra)/400));const win=x.sa>x.sb?1:x.sa<x.sb?0:.5;
    const K=24*(1+Math.min(Math.abs(x.sa-x.sb),6)/12);
    const da=Math.round(K*(win-ea));
    delta[x.id]={a:da,b:-da};
    x.a.forEach(id=>{R[id]=g(id)+da;(hist[id]=hist[id]||[{p:P0}]).push({p:R[id],r:win===1?'w':win===0?'l':'d',date:md[x.meetId]})});
    x.b.forEach(id=>{R[id]=g(id)-da;(hist[id]=hist[id]||[{p:P0}]).push({p:R[id],r:win===0?'w':win===1?'l':'d',date:md[x.meetId]})});
  });
  return {R,delta,hist};
}
const pOf=id=>ELO.R[id]??P0;
const sgn=v=>v>0?'+'+v:v<0?'−'+Math.abs(v):'0';
function dayDelta(meetId){const t={};meetMatches(meetId).forEach(x=>{const d=ELO.delta[x.id];if(!d)return;x.a.forEach(id=>t[id]=(t[id]||0)+d.a);x.b.forEach(id=>t[id]=(t[id]||0)+d.b)});return t}

async function hashPin(p){
  const txt='ssm-tennis:'+p;
  try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;for(const c of txt)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'd'+h.toString(16);
}

const CHOICES=[
  ['random','무작위','짝과 상대를 무작위로 섞어요. 쉬는 순서만 고르게 돌려요.'],
  ['seed','시드 배정','시드 순서대로 강한 선수와 약한 선수를 섞어 팽팽한 경기를 만들어요.'],
  ['manual','직접 생성','코트마다 선수를 직접 골라 경기를 하나씩 넣어요.']
];
const modeName=k=>(CHOICES.find(c=>c[0]===k)||['','매치'])[1];
function seedOrder(meet){
  const att=(meet.attendees||[]).filter(id=>S.members.some(m=>m.id===id));
  const saved=(meet.seeds||[]).filter(id=>att.includes(id));
  const rest=att.filter(id=>!saved.includes(id)).sort((x,y)=>pOf(y)-pOf(x));
  return [...saved,...rest];
}
const attOf=meet=>(meet.attendees||[]).filter(id=>S.members.some(m=>m.id===id));

/* builds matches without saving; mode = random | seed */
function buildMatches(meet,mode){
  const {type,courts,rounds}=S.gen;
  const rnd=mode==='random';
  const st={};if(mode==='seed'){const o=seedOrder(meet),n=o.length;o.forEach((id,i)=>st[id]=n>1?1-i/(n-1):.5)}
  const pw=id=>st[id]??.5;
  const pool=attOf(meet);
  const per=type==='D'?4:2;const slots=Math.min(courts,Math.floor(pool.length/per));
  if(slots<1){toast(type==='D'?'복식은 참가자가 4명 이상이어야 해요.':'단식은 참가자가 2명 이상이어야 해요.');return null}
  const partner={},opp={},played={};
  const note=(x,w)=>{[x.a,x.b].forEach(tm=>{if(tm.length===2){const k=pk(tm[0],tm[1]);partner[k]=(partner[k]||0)+w}});x.a.forEach(p=>x.b.forEach(q=>{const k=pk(p,q);opp[k]=(opp[k]||0)+w}))};
  seasonMatches().forEach(x=>note(x,1));
  const mm=meetMatches(meet.id);
  mm.forEach(x=>{note(x,2);[...x.a,...x.b].forEach(p=>played[p]=(played[p]||0)+1)});
  let round=mm.reduce((m,x)=>Math.max(m,x.round||0),0);
  const out=[];
  for(let r=0;r<rounds;r++){
    round++;
    const sel=shuffle(pool.slice()).sort((x,y)=>(played[x]||0)-(played[y]||0)).slice(0,slots*per);
    let best=null,bc=Infinity;
    for(let it=0;it<(rnd?1:900);it++){
      const s=shuffle(sel.slice());let c=0;const ms=[];
      for(let k=0;k<slots;k++){
        const g=s.slice(k*per,k*per+per);
        const a=type==='D'?[g[0],g[1]]:[g[0]],b=type==='D'?[g[2],g[3]]:[g[1]];
        if(!rnd){
          if(type==='D')c+=4*((partner[pk(a[0],a[1])]||0)**2+(partner[pk(b[0],b[1])]||0)**2);
          a.forEach(p=>b.forEach(q=>c+=(opp[pk(p,q)]||0)**2));
          const sa=a.reduce((x,p)=>x+pw(p),0),sb=b.reduce((x,p)=>x+pw(p),0);
          c+=60*(sa-sb)**2;
        }
        ms.push({a,b});
      }
      if(c<bc){bc=c;best=ms;if(c===0)break}
    }
    best.forEach((x,k)=>{const m={id:uid(),meetId:meet.id,round,court:k+1,type,a:x.a,b:x.b,sa:null,sb:null,createdAt:Date.now()};note(m,2);[...m.a,...m.b].forEach(p=>played[p]=(played[p]||0)+1);out.push(m)});
  }
  return out;
}

function flipSeeds(fn,moved){
  const before={};document.querySelectorAll('.seed[data-sid]').forEach(el=>before[el.dataset.sid]=el.getBoundingClientRect().top);
  fn();
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.seed[data-sid]').forEach(el=>{
    const id=el.dataset.sid,t=before[id];if(t==null)return;
    const dy=t-el.getBoundingClientRect().top;
    if(id===moved)el.classList.add('moved');else if(dy)el.classList.add('shifted');
    if(!dy||reduce||!el.animate)return;
    el.animate([{transform:`translateY(${dy}px)`},{transform:'translateY(0)'}],{duration:320,easing:'cubic-bezier(.2,.9,.25,1)'});
  });
}

  });

function sparkline(hist){
  const pts=hist.map(h=>h.p);if(pts.length<2)return `<div class="spk-empty">경기 기록이 쌓이면 P 변화 그래프가 그려져요.</div>`;
  const W=300,H=96,pl=6,pr=6,pt=12,pb=14;
  let mn=Math.min(...pts),mx=Math.max(...pts);if(mx-mn<20){const c=(mx+mn)/2;mn=c-10;mx=c+10}
  const X=i=>pl+(W-pl-pr)*i/(pts.length-1),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const line=pts.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const area=line+`L${X(pts.length-1).toFixed(1)},${H-pb}L${X(0).toFixed(1)},${H-pb}Z`;
  const y0=Y(P0);const last=pts[pts.length-1],up=last>=pts[0];
  return `<svg class="spk" viewBox="0 0 ${W} ${H}" role="img" aria-label="P 변화 ${pts[0]}에서 ${last}">
    <defs><linearGradient id="spg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0A8FD8" stop-opacity=".35"/><stop offset="1" stop-color="#0A8FD8" stop-opacity="0"/></linearGradient></defs>
    ${y0>=pt&&y0<=H-pb?`<line x1="${pl}" x2="${W-pr}" y1="${y0}" y2="${y0}" stroke="#5D656C" stroke-dasharray="3 4" stroke-width="1"/><text x="${W-pr}" y="${y0-4}" text-anchor="end" fill="#8C959D" font-size="9" font-family="Roboto,sans-serif">${P0}</text>`:''}
    <path d="${area}" fill="url(#spg)"/><path d="${line}" fill="none" stroke="#0A8FD8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(pts.length-1)}" cy="${Y(last)}" r="4.5" fill="${up?'#FFD400':'#FF7E6E'}" stroke="#131415" stroke-width="2"/>
    <text x="${pl}" y="${H-2}" fill="#8C959D" font-size="9" font-family="Roboto,sans-serif">첫 경기</text><text x="${W-pr}" y="${H-2}" text-anchor="end" fill="#8C959D" font-size="9" font-family="Roboto,sans-serif">최근</text></svg>`;
}

  const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);

  if(!wasEdit){S.meetTab='matches';S.build={step:'choose',preview:null,drafts:[]}}
  S.editId=null;S.draft=null;
  put('meets',obj);toTop();toast(wasEdit?'저장했어요.':'매치데이를 열었어요.');
}
function manAdd(){
  const m=curMeet();const man=S.man;const n=man.type==='D'?2:1;const b=S.build;
  const a=man.a.slice(0,n),bb=man.b.slice(0,n);
  if([...a,...bb].some(x=>!x)){toast('선수를 모두 선택해 주세요.');return}
  const exMax=meetMatches(m.id).reduce((x,y)=>Math.max(x,y.round),0);
  const dr=b.drafts;const dMax=dr.reduce((x,y)=>Math.max(x,y.round),exMax);
  let round=dr.length?dMax:exMax+1;
  if(dr.some(x=>x.round===round&&(x.court===man.court||[...x.a,...x.b].some(p=>a.includes(p)||bb.includes(p)))))round++;
  dr.push({id:uid(),meetId:m.id,round,court:man.court,type:man.type,a,b:bb,sa:null,sb:null,createdAt:Date.now()});
  const maxCourt=Math.max(2,S.gen.courts);
  S.man={type:man.type,court:man.court<maxCourt?man.court+1:1,a:[null,null],b:[null,null]};render();toast(`ROUND ${round} · COURT ${man.court}에 추가했어요.`);
}
function bBack(){
  const b=S.build;if(!b)return;
  if(b.preview)b.preview=null;
  else if(b.step==='manual'&&b.drafts.length){confirmModal('직접 생성 취소',`추가한 경기 ${b.drafts.length}개가 저장되지 않고 사라져요.`,'나가기',()=>{b.drafts=[];b.step='choose';render()});return}
  else if(b.step!=='choose')b.step='choose';
  else S.build=null;
  render();toTop();
}
function bConfirm(){
  const b=S.build;const list=b.step==='manual'?b.drafts:b.preview;if(!list||!list.length)return;
  list.forEach(x=>put('matches',x));
  const n=list.length,how=modeName(b.step);
  S.build=null;S.meetTab='matches';render();toTop();
  toast(`${how} 방식으로 ${n}경기를 만들었어요.`);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-act]');if(!t)return;
  const d=t.dataset;const m=curMeet();
  if(t.id==='c-rm'||d.pick!==undefined||d.ico!==undefined||d.fab!==undefined||d.k!==undefined||d.n!==undefined||d.asel!==undefined)return;
  const NEED=['club-edit','new','edit-meet','edit-att','build','add-member','clear-empty','del-meet','m-all','m-clr','pin-clear'];
  if((NEED.includes(d.act)||d.delmatch||(d.act==='pin-set'&&cfg().pin))&&!isAdmin()){adminLogin(()=>{const again=document.querySelector(d.act?`[data-act="${d.act}"]`:`[data-delmatch="${d.delmatch}"]`);again&&again.click()});return}
  if(d.scoreb){scoreModal(d.scoreb);return}
  if(d.club){selectClub(d.club);return}
  if(d.qslot){qmPick(d.qslot[0],+d.qslot[1]);return}
  if(d.qtype&&S.qm){S.qm.type=d.qtype;if(d.qtype==='S'){S.qm.a[1]=null;S.qm.b[1]=null}render();return}
  if(d.qn&&S.qm){S.qm['s'+d.qn[0]]=+d.qn.slice(1);render();return}
  if(d.hist){S.histType=d.hist;render();return}
  if(d.go){if(d.go==='meet'&&S.editId){S.view='meet';S.editId=null;S.draft=null}else{S.view=d.go;S.editId=null;S.draft=null;if(d.go==='feed'){S.meetId=null;S.build=null}}render();toTop();return}
  if(d.meet){S.view='meet';S.meetId=d.meet;S.meetTab='matches';S.build=null;S.man={type:'D',court:1,a:[null,null],b:[null,null]};render();toTop();return}
  if(d.member){memberModal(d.member);return}
  if(d.nav){S.view=d.nav;S.meetId=null;S.build=null;S.editId=null;S.draft=null;render();if(d.nav==='roster'){const r=document.getElementById('roster-sec');r?r.scrollIntoView({block:'start'}):toTop()}else toTop();return}
  if(d.mtab){S.meetTab=d.mtab;render();toTop();return}
  if(d.rank){S.rankType=d.rank;render();return}
  if(d.gtype){S.gen.type=d.gtype;render();return}
  if(d.choose){S.build.step=d.choose;S.build.preview=null;if(d.choose==='manual'){S.build.drafts=[];S.man={type:S.gen.type,court:1,a:[null,null],b:[null,null]}}render();toTop();return}
  if(d.rmdraft){S.build.drafts=S.build.drafts.filter(x=>x.id!==d.rmdraft);render();return}
  if(d.mtype){S.man.type=d.mtype;if(d.mtype==='S'){S.man.a[1]=null;S.man.b[1]=null}render();return}
  if(d.court){S.man.court=+d.court;render();return}
  if(d.slot){pickModal(d.slot[0],+d.slot[1]);return}
  if(d.step){const k=d.step,lim=k==='courts'?[1,6]:[1,10];S.gen[k]=Math.min(lim[1],Math.max(lim[0],S.gen[k]+(+d.d)));render();return}
  if(d.venue!==undefined){syncDraft();S.draft.place=d.venue;S.draft.customVenue=false;render();return}
  if(d.env){syncDraft();S.draft.env=d.env;render();return}
  if(d.surface){syncDraft();S.draft.surface=d.surface;render();return}
  if(d.matt&&m){const s2=new Set(m.attendees||[]);s2.has(d.matt)?s2.delete(d.matt):s2.add(d.matt);put('meets',{...m,attendees:[...s2]});return}
  if(d.datt){syncDraft();const s=new Set(S.draft.attendees);s.has(d.datt)?s.delete(d.datt):s.add(d.datt);S.draft.attendees=[...s];render();return}
  if(d.delmatch){confirmModal('경기 삭제','이 경기와 입력한 점수를 지울까요?','삭제',()=>del('matches',d.delmatch));return}
  switch(d.act){
    case 'close':closeModal();break;
    case 'fab':if(S.view==='clubs')clubModal(true);else fabModal();break;
    case 'club-edit':clubModal(false);break;
    case 'club-new':clubModal(true);break;
    case 'qm-save':qmSave();break;
    case 'copy-season':copyText(seasonText(),'순위표');break;
    case 'copy-meet':if(m)copyText(meetText(m),'경기 결과');break;
    case 'login':closeModal();adminLogin();break;
    case 'logout':closeModal();setKey('');render();toast('회원 모드로 전환했어요.');break;
    case 'pin-set':setPinFlow();break;
    case 'pin-clear':clearPin();break;
    case 'reload':location.reload();break;
    case 'new':openNew(null);break;
    case 'go':go();break;
    case 'custom-venue':syncDraft();S.draft.customVenue=true;if(BASE_VENUES.includes(S.draft.place)||S.meets.some(x=>x.place===S.draft.place))S.draft.place='';render();setTimeout(()=>{const i=$('#d-place');i&&i.focus()},0);break;
    case 'm-all':if(m)put('meets',{...m,attendees:S.members.map(x=>x.id)});break;
    case 'm-clr':if(m)put('meets',{...m,attendees:[]});break;
    case 'd-all':syncDraft();S.draft.attendees=S.members.map(x=>x.id);render();break;
    case 'd-clr':syncDraft();S.draft.attendees=[];render();break;
    case 'edit-att':m&&attModal(m);break;
    case 'edit-meet':m&&openNew(m);break;
    case 'add-member':memberModal(null);break;
    case 'build':S.build={step:'choose',preview:null,drafts:[]};render();toTop();break;
    case 'b-exit':S.build=null;render();break;
    case 'b-back':bBack();break;
    case 'b-preview':case 'b-shuffle':if(m){const p=buildMatches(m,S.build.step);if(p){S.build.preview=p;render();if(d.act==='b-preview')toTop()}}break;
    case 'b-confirm':bConfirm();break;
    case 'seed-reset':if(m){const {seeds,...rest}=m;flipSeeds(()=>put('meets',rest),null);toast('P 순서로 다시 정렬했어요.')}break;
    case 'man-add':m&&manAdd();break;
    case 'clear-empty':if(m){const em=meetMatches(m.id).filter(x=>x.sa==null&&x.sb==null);confirmModal('빈 경기 삭제',`점수가 없는 경기 ${em.length}개를 지울까요?`,'삭제',()=>em.forEach(x=>del('matches',x.id)))}break;
    case 'del-meet':{const mm=S.meets.find(x=>x.id===S.editId);if(mm)confirmModal('매치데이 삭제',`${esc(fmtK(mm.date))} 매치데이와 경기 ${meetMatches(mm.id).length}개 기록을 모두 지울까요?`,'모두 삭제',()=>{meetMatches(mm.id).forEach(x=>del('matches',x.id));S.view='feed';S.meetId=null;S.editId=null;S.draft=null;del('meets',mm.id)})}break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='season'){S.season=+el.value;render();return}
  if(el.id==='q-date'&&S.qm){S.qm.date=el.value||TODAY;render();return}
  if(el.dataset&&el.dataset.score){
    const x=S.matches.find(m=>m.id===el.dataset.score);if(!x)return;
    const v=el.value===''?null:Math.max(0,Math.min(99,Math.round(+el.value)));
    put('matches',{...x,[el.dataset.side==='a'?'sa':'sb']:v});
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('.modal'))closeModal();if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.score)e.target.blur()});

/* ---------- seed drag ---------- */
function moveSeed(id,to,animate){
  const m=curMeet();if(!m)return;const o=seedOrder(m);const from=o.indexOf(id);if(from<0||to===from)return;
  o.splice(from,1);o.splice(to,0,id);
  const commit=()=>put('meets',{...m,seeds:o});
  if(animate)flipSeeds(commit,id);else{commit();const el=document.querySelector(`.seed[data-sid="${id}"]`);if(el)el.classList.add('moved')}
}
function dragFrame(){
  if(!drag)return;
  const vb=vpBox(),y=drag.lastY-vb.top,vh=vb.h,edge=90;
  if(y<edge+60)scBy(-Math.ceil((edge+60-y)/8));
  else if(y>vh-edge-90)scBy(Math.ceil((y-(vh-edge-90))/8));
  layoutDrag();drag.raf=requestAnimationFrame(dragFrame);
}
function layoutDrag(){
  const d=drag;const dy=d.lastY-d.startY+(scY()-d.scroll0);
  d.row.style.transform=`translateY(${dy}px) scale(1.03)`;
  const n=d.rows.length;const to=Math.max(0,Math.min(n-1,d.from+Math.round(dy/d.step)));
  if(to!==d.to){d.to=to;try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
  d.rows.forEach((r,i)=>{
    if(r===d.row){r.querySelector('.no').textContent=to+1;return}
    const sh=(d.from<i&&i<=to)?-d.step:(to<=i&&i<d.from)?d.step:0;
    r.style.transform=sh?`translateY(${sh}px)`:'';
    const ni=i+(sh<0?-1:sh>0?1:0);r.querySelector('.no').textContent=ni+1;
  });
}
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.grip');if(!h||drag)return;
  const row=h.closest('.seed'),list=row.parentElement;const rows=[...list.querySelectorAll('.seed')];
  if(rows.length<2)return;
  const r0=rows[0].getBoundingClientRect(),r1=rows[1].getBoundingClientRect();
  drag={id:row.dataset.sid,row,rows,list,from:rows.indexOf(row),to:rows.indexOf(row),startY:e.clientY,lastY:e.clientY,step:r1.top-r0.top,scroll0:scY()};
  try{h.setPointerCapture(e.pointerId)}catch(err){}
  row.classList.add('lifting');list.classList.add('dragging');
  rows.forEach(r=>{if(r!==row)r.style.transition='transform .2s cubic-bezier(.2,.9,.25,1)'});
  e.preventDefault();drag.raf=requestAnimationFrame(dragFrame);
});
document.addEventListener('pointermove',e=>{if(drag){drag.lastY=e.clientY;e.preventDefault()}},{passive:false});
function endDrag(){
  if(!drag)return;const d=drag;cancelAnimationFrame(d.raf);
  const off=(d.to-d.from)*d.step-(scY()-d.scroll0);
  d.row.style.transition='transform .16s ease-out';d.row.style.transform=`translateY(${(d.to-d.from)*d.step}px)`;
  setTimeout(()=>{
    drag=null;
    d.rows.forEach(r=>{r.style.transition='';r.style.transform=''});
    d.row.classList.remove('lifting');d.list.classList.remove('dragging');
    if(d.to!==d.from)moveSeed(d.id,d.to,false);else{d.rows.forEach((r,i)=>r.querySelector('.no').textContent=i+1);if(pending)render()}
  },170);
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{
  const g=e.target.closest&&e.target.closest('.grip');if(!g||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
  e.preventDefault();const m=curMeet();const o=seedOrder(m);const i=o.indexOf(g.dataset.grip);const j=i+(e.key==='ArrowUp'?-1:1);
  if(j<0||j>=o.length)return;moveSeed(g.dataset.grip,j,true);
  const nb=document.querySelector(`[data-grip="${g.dataset.grip}"]`);nb&&nb.focus({preventScroll:true});
});

/* ---------- boot ---------- */
async function init(){
  render();
  let db=null;
  // show the last synced copy right away while the shared store connects
  if(loadCache()){S.loading=false;render()}
  const slowT=setTimeout(()=>{if(S.loading){S.slow=true;render()}},8000);
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(err){db=null}
  if(!db){clearTimeout(slowT);if(S.loading||!S.members.length){S.local=true;loadLocal()}else S.local=true;S.loading=false;S.slow=false;render();return}
  DB=db;const got={};
  queue.splice(0).forEach(f=>f());
  const subscribe=col=>db.collection(col).onSnapshot(snap=>{
      const rows=snap.docs.map(d=>({id:d.id,...d.data()}));if(SCOPED.includes(col)){RAW[col]=rows;applyClub()}else S[col]=rows;got[col]=1;
      if(got.members&&got.meets){S.loading=false;S.slow=false;clearTimeout(slowT)}
      saveCache();render();
    },e=>{
      if(e&&e.code==='unavailable'){setTimeout(()=>subscribe(col),1500);return}
      got[col]=1;S.loading=false;toast('기록을 불러오지 못했어요. 다시 시도해 주세요.');render();
    });
  ['members','meets','matches','config','clubs'].forEach(subscribe);
}
init();
})();
